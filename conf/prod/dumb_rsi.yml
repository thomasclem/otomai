strategy:
  KIND: DumbRSIStrategy
  strategy_params:
    rsi_window: 14
    rsi_overbought_threshold: 70
    rsi_oversold_threshold: 30
    rsi_timeframe: 4h
  database_service:
    KIND: DynamoDB
  exchange_service:
    KIND: Bitget
    default_type: future
  notifier_service:
    KIND: Telegram
    chat_id: 5609154988
  trading_params:
    allowed_order_sides:
      - sell
    equity_trade_pct: 100
    leverage: 1
    stop_loss_pct: 20
    take_profit_pct: 7
    max_simultaneous_positions: 1
    order_type: market
    margin_mode: isolated
    order_timeout: 600
    safety_margin: 0.02
    max_retries: 3