version: "3.8"
# One Compose project per strategy and environment: its own pod, container and image,
# so several bots run side by side and rebuilding one never replaces another.
name: otomai-${STRATEGY:-mrat_zscore}-${ENV:-dev}
services:
  app:
    container_name: otomai-${STRATEGY:-mrat_zscore}-${ENV:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-dev}
      OTOMAI_ENV_DIR: /app/env
      STRATEGY: ${STRATEGY:-mrat_zscore}
    env_file:
      - env/base.env
      - env/${STRATEGY:-mrat_zscore}/${ENV:-dev}.env
    volumes:
      - ./data:/app/data:z
      - ./env:/app/env:ro,Z
    command: ["--files", "conf/${ENV:-dev}/${STRATEGY:-mrat_zscore}.yml"]
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 5m
